<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>실시간 암호화폐 가격 변동 추적기</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- 전체 콘텐츠 영역 -->
    <div class="container">


        <!-- 제목 -->
        <h1>
            실시간 암호화폐 가격 변동 추적기
        </h1>


        <!-- 전체보기 / 관심항목 -->
        <div class="tabs">

            <button id="allBtn">
                전체보기
            </button>

            <button id="favoriteBtn">
                관심항목
            </button>

        </div>


        <!-- 암호화폐 검색 -->
        <div class="search">

            <input
                type="text"
                id="searchInput"
                placeholder="심볼 검색 (예: BTCUSDT)"
            >

        </div>


        <!-- 암호화폐 목록 -->
        <table>

            <thead>

                <tr>

                    <th>관심</th>

                    <th>심볼</th>

                    <th>현재가</th>

                    <th>24시간 변동률</th>

                    <th>최고가</th>

                    <th>최저가</th>

                </tr>

            </thead>


            <tbody id="coinList">

                <!--
                    JavaScript에서
                    암호화폐 데이터가 들어갈 부분
                -->

            </tbody>

        </table>


    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
